name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: circuitdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/circuitdesk_test
      DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/circuitdesk_test
      APP_URL: http://localhost:3117
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply Drizzle migrations + RLS policies to integration Postgres 17
        run: pnpm db:migrate
      - name: Verify idempotent synthetic seed on Postgres 17
        run: pnpm db:seed:demo
      - name: Run PostgreSQL integration suite
        run: pnpm test:integration
      - name: Build production Next.js bundle
        run: pnpm build
      - name: Prepare isolated Postgres 17 database for Playwright E2E
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE circuitdesk_e2e;"
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/circuitdesk_e2e DATABASE_URL_UNPOOLED=postgres://postgres:postgres@localhost:5432/circuitdesk_e2e pnpm db:migrate
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/circuitdesk_e2e pnpm db:seed:demo
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright E2E + axe WCAG 2.2 AA suite
        env:
          CI: "true"
          E2E_PORT: "3117"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/circuitdesk_e2e
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
